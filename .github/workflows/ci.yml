name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Quality Gate ──────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── Install tools ──────────────────────────────────────────────────
      - name: Install Node linters
        run: |
          npm install -g \
            markdownlint-cli \
            prettier \
            stylelint stylelint-config-standard \
            htmlhint

      - name: Install Python tools
        run: pip install yamllint -r requirements.txt

      # ── Markdown lint ──────────────────────────────────────────────────
      - name: Markdown lint
        run: markdownlint 'docs/**/*.md' --config .markdownlint.json

      # ── Prettier format check ──────────────────────────────────────────
      - name: Prettier check
        run: prettier --check 'docs/**/*.md' '*.yml' 'mkdocs.yml'

      # ── YAML lint ─────────────────────────────────────────────────────
      - name: YAML lint
        run: yamllint -c .yamllint.yml mkdocs.yml .github/workflows/*.yml

      # ── CSS lint ───────────────────────────────────────────────────────
      - name: Stylelint (CSS)
        run: stylelint 'docs/stylesheets/**/*.css'

      # ── MkDocs strict build ───────────────────────────────────────────
      - name: MkDocs build (strict)
        run: mkdocs build --strict
        env:
          CI: "true"
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}

      # ── HTML lint (built output) ──────────────────────────────────────
      - name: HTMLHint
        run: htmlhint 'site/**/*.html' --config .htmlhintrc

  # ── Security Gate ─────────────────────────────────────────────────────
  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
